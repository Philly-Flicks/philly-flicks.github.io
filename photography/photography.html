<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Photography | Philip Hazeley</title>

  <link rel="stylesheet" href="photography.css" />
</head>
<body>

  <section class="photo-page hero-section" id="top">

    <div class="hero-content animate">
      <h1>PHOTOGRAPHY</h1>
    </div>

    <div class="hero-image animate">
      <img src="images/photography-hero.jpg" loading="lazy" alt="Photography work by Philip Hazeley">
    </div>

    <a href="#collections" class="take-look">
        COLLECTIONS <span>▼</span>
      </a>

    <a href="../index.html#portfolio" class="back-link">
        BACK TO PORTFOLIO ◀
      </a>

  </section>

  <!-- ADD 41: NEW PHOTOGRAPHY COLLECTIONS -->

<section class="event-collections" id="collections">

    <div class="event-collections-header">
        <h2>COLLECTIONS</h2>
        <p>SELECT A COLLECTION</p>
    </div>

    <div class="event-collections-grid" id="eventCollectionsGrid"></div>

</section>


<!-- COLLECTION POPUP -->

<div class="collection-modal" id="collectionModal">

  <button class="collection-close" id="collectionClose">×</button>

  <div class="collection-modal-info">

    <div class="collection-title-row">
      <button class="collection-switch-arrow" id="previousCollection">&#10094;</button>

      <h2 id="collectionTitle"></h2>

      <button class="collection-switch-arrow" id="nextCollection">&#10095;</button>
    </div>

    <p id="collectionDate"></p>
    <p id="collectionPhotoCount"></p>

  </div>

  <button class="collection-arrow collection-prev" id="collectionPrev">
    &#10094;
  </button>

  <div class="collection-image-wrapper">

    <div class="collection-loader" id="collectionLoader"></div>

    <img
      id="collectionImage"
      class="collection-main-image"
      src=""
      alt=""
      draggable="false"
    >

  </div>

  <button class="collection-arrow collection-next" id="collectionNext">
    &#10095;
  </button>

  <div class="collection-counter" id="collectionCounter">
    1 / 1
  </div>

</div>

  <script src="photography.js"></script>
</body>
</html>
