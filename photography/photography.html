<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Photography | Philip Hazeley</title>

  <link rel="stylesheet" href="photography.css" />
</head>
<body>

  <section class="photo-page hero-section" id="top">

    <div class="hero-content animate">
      <h1>PHOTOGRAPHY</h1>
    </div>

    <div class="hero-image animate">
      <img src="images/photography-hero.jpg" loading="lazy" alt="Photography work by Philip Hazeley">
    </div>

    <a href="#collections" class="take-look">
        COLLECTIONS <span>▼</span>
      </a>

    <a href="../index.html#portfolio" class="back-link">
        BACK TO PORTFOLIO ◀
      </a>

  </section>

  <!-- ADD 41: NEW PHOTOGRAPHY COLLECTIONS -->

<section class="event-collections" id="collections">

    <div class="event-collections-header">
        <h2>COLLECTIONS</h2>
        <p>SELECT A COLLECTION</p>
    </div>

    <div class="event-collections-grid" id="eventCollectionsGrid"></div>

</section>


<!-- COLLECTION POPUP -->

<div class="collection-modal-info">

    <div class="collection-title-row">

        <button
            class="collection-switch-arrow"
            id="previousCollection"
            aria-label="Previous collection"
        >
            &#10094;
        </button>

        <h2 id="collectionTitle"></h2>

        <button
            class="collection-switch-arrow"
            id="nextCollection"
            aria-label="Next collection"
        >
            &#10095;
        </button>

    </div>

    <p id="collectionDate"></p>
    <p id="collectionPhotoCount"></p>

</div>

    <button class="collection-arrow collection-prev" id="collectionPrev" aria-label="Previous photo">
        &#10094;
    </button>

    <div class="collection-image-wrapper">

        <div class="collection-loader" id="collectionLoader"></div>

        <img
            id="collectionImage"
            class="collection-main-image"
            src=""
            alt=""
            draggable="false"
        >

    </div>

    <button class="collection-arrow collection-next" id="collectionNext" aria-label="Next photo">
        &#10095;
    </button>

    <div class="collection-counter" id="collectionCounter">
        1 / 1
    </div>

</div>


  <a href="#collections" class="back-to-collections">
    BACK TO THE TOP ▲
</a>

</section>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close">&times;</button>

  <button class="lightbox-arrow lightbox-prev">◀</button>

  <div class="loader" id="loader"></div>

  <img src="" loading="lazy" alt="Expanded gallery photo" id="lightbox-img">

  <button class="lightbox-arrow lightbox-next">▶</button>

  <p class="lightbox-counter" id="lightbox-counter">1 / 1</p>
</div>

  <script src="photography.js"></script>
</body>
</html>
