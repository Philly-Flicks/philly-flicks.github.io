<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Photography | Philip Hazeley</title>

  <link rel="stylesheet" href="photography.css" />
</head>
<body>

  <section class="photo-page hero-section" id="top">

    <div class="hero-content animate">
      <h1>PHOTOGRAPHY</h1>
    </div>

    <div class="hero-image animate">
      <img src="images/photography-hero.jpg" alt="Photography work by Philip Hazeley">
    </div>

    <a href="#collections" class="take-look">
        COLLECTIONS <span>▼</span>
      </a>

  </section>

  <section class="photo-page collections-section" id="collections">

    <div class="collections-content animate">

      <h2>COLLECTIONS</h2>

      <div class="collections-grid">

        <a href="#featured" class="collection-card">
          <img src="images/featured.jpg" alt="Featured photography">
          <h3>FEATURED</h3>
        </a>

        <a href="#portraits" class="collection-card">
          <img src="images/portraits.jpg" alt="Portrait photography">
          <h3>PORTRAITS</h3>
        </a>

        <a href="#fashion" class="collection-card">
          <img src="images/fashion.jpg" alt="Fashion photography">
          <h3>FASHION</h3>
        </a>

        <a href="#graduations" class="collection-card">
          <img src="images/graduations.jpg" alt="Graduation photography">
          <h3>GRADUATIONS</h3>
        </a>

        <a href="#sports" class="collection-card">
          <img src="images/sports.jpg" alt="Sports photography">
          <h3>SPORTS</h3>
        </a>

        <a href="#lifestyle" class="collection-card">
          <img src="images/lifestyle.jpg" alt="Lifestyle photography">
          <h3>LIFESTYLE</h3>
        </a>

      </div>

      <a href="../index.html#portfolio" class="back-link">
        BACK TO PORTFOLIO ◀
      </a>

    </div>

  </section>

  <section class="gallery-section" id="featured">
  <h2 class="animate">FEATURED</h2>

  <div class="gallery-grid animate">
    <img src="images/featured/1.jpg" alt="Featured photography">
    <img src="images/featured/2.jpg" alt="Featured photography">
    <img src="images/featured/3.jpg" alt="Featured photography">
    <img src="images/featured/4.jpg" alt="Featured photography">
  </div>
</section>

<section class="gallery-section" id="portraits">
  <h2 class="animate">PORTRAITS</h2>

  <div class="gallery-grid animate">
    <img src="images/portraits/1.jpg" alt="Portrait photography">
    <img src="images/portraits/2.jpg" alt="Portrait photography">
    <img src="images/portraits/3.jpg" alt="Portrait photography">
    <img src="images/portraits/4.jpg" alt="Portrait photography">
  </div>
</section>

<section class="gallery-section" id="fashion">
  <h2 class="animate">FASHION</h2>

  <div class="gallery-grid animate">
    <img src="images/fashion/1.jpg" alt="Fashion photography">
    <img src="images/fashion/2.jpg" alt="Fashion photography">
    <img src="images/fashion/3.jpg" alt="Fashion photography">
    <img src="images/fashion/4.jpg" alt="Fashion photography">
  </div>
</section>

<section class="gallery-section" id="graduations">
  <h2 class="animate">GRADUATIONS</h2>

  <div class="gallery-grid animate">
    <img src="images/graduations/1.jpg" alt="Graduation photography">
    <img src="images/graduations/2.jpg" alt="Graduation photography">
    <img src="images/graduations/3.jpg" alt="Graduation photography">
    <img src="images/graduations/4.jpg" alt="Graduation photography">
  </div>
</section>

<section class="gallery-section" id="sports">
  <h2 class="animate">SPORTS</h2>

  <div class="gallery-grid animate">
    <img src="images/sports/1.jpg" alt="Sports photography">
    <img src="images/sports/2.jpg" alt="Sports photography">
    <img src="images/sports/3.jpg" alt="Sports photography">
    <img src="images/sports/4.jpg" alt="Sports photography">
  </div>
</section>

<section class="gallery-section" id="lifestyle">
  <h2 class="animate">LIFESTYLE</h2>

  <div class="gallery-grid animate">
    <img src="images/lifestyle/1.jpg" alt="Lifestyle photography">
    <img src="images/lifestyle/2.jpg" alt="Lifestyle photography">
    <img src="images/lifestyle/3.jpg" alt="Lifestyle photography">
    <img src="images/lifestyle/4.jpg" alt="Lifestyle photography">
  </div>
</section>

  <script src="photography.js"></script>
</body>
</html>
