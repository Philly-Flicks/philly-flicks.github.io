<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Video Editing | Philip Hazeley</title>

  <link rel="stylesheet" href="video-editing.css" />
</head>
<body>

  <section class="video-page hero-section" id="top">

    <div class="hero-content animate">
      <h1>VIDEO EDITING</h1>
    </div>

    <div class="hero-video animate">
      <video autoplay muted loop playsinline>
        <source src="videos/hero-video.mp4" type="video/mp4">
      </video>
    </div>

    <a href="#selected-work" class="take-look">
      SELECTED WORK <span>▼</span>
    </a>

    <a href="../index.html#portfolio" class="back-link">
      BACK TO PORTFOLIO ◀
    </a>

  </section>

  <section class="video-page selected-section" id="selected-work">

    <div class="selected-content animate">

      <h2>SELECTED WORK</h2>

      <div class="selected-grid">

        <a href="#youtube-edits" class="selected-card">
          <div class="card-preview youtube-preview"></div>
          <h3>YOUTUBE EDITS</h3>
        </a>

        <a href="#character-edits" class="selected-card">
          <div class="card-preview character-preview"></div>
          <h3>CHARACTER EDITS</h3>
        </a>

      </div>

    </div>

  </section>

  <section class="gallery-section" id="youtube-edits">

    <h2 class="gallery-heading animate">
      YOUTUBE EDITS

      <span class="gallery-arrows">
        <a href="#selected-work">▲</a>
        <a href="#character-edits">▼</a>
      </span>
    </h2>

    <div class="youtube-grid animate">

      <iframe src="https://www.youtube.com/embed/T8fySAoDF4E"
title="YouTube Edit 1"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/RO_gPGnsdyA"
title="YouTube Edit 2"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/jN9eJeqbHco"
title="YouTube Edit 3"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/Yqe7Pk004SQ"
title="YouTube Edit 4"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/5izLZv25heY"
title="YouTube Edit 5"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/Jis2ZXuCze4"
title="YouTube Edit 6"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/VTUcWpVS3cQ"
title="YouTube Edit 7"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/634i7qzn9Cc"
title="YouTube Edit 8"
allowfullscreen></iframe>

<iframe src="https://www.youtube.com/embed/AIBWei9hdyk"
title="YouTube Edit 9"
allowfullscreen></iframe>

    </div>

  </section>

  <section class="gallery-section" id="character-edits">

    <h2 class="gallery-heading animate">
      CHARACTER EDITS

      <span class="gallery-arrows">
        <a href="#youtube-edits">▲</a>
      </span>
    </h2>

    <div class="character-grid animate">

      <video controls preload="metadata">
        <source src="videos/character-1.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-2.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-3.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-4.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-5.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-6.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-7.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-8.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-9.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata">
        <source src="videos/character-10.mp4" type="video/mp4">
      </video>

    </div>

    <a href="#selected-work" class="back-to-selected">
      BACK TO SELECTED WORK ▲
    </a>

  </section>

  <script src="video-editing.js"></script>
</body>
</html>
