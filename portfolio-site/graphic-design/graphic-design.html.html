<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Graphic Design | Philip Hazeley</title>

  <link rel="stylesheet" href="graphic-design.css" />
</head>
<body>

  <section class="design-page hero-section" id="top">

    <div class="hero-content animate">
      <h1>GRAPHIC<br>DESIGN</h1>
    </div>

    <div class="hero-image animate">
      <img src="images/design-hero.jpg" alt="Graphic design work by Philip Hazeley">
    </div>

    <a href="#selected-work" class="take-look">
      SELECTED WORK <span>▼</span>
    </a>

    <a href="../index.html#portfolio" class="back-link">
      BACK TO PORTFOLIO ◀
    </a>

  </section>

  <section class="design-page selected-section" id="selected-work">

    <div class="selected-content animate">

      <h2>SELECTED WORK</h2>

      <div class="selected-grid">

        <a href="#graphics" class="selected-card">
          <img src="images/graphics.jpg" alt="Graphics">
          <h3>GRAPHICS</h3>
        </a>

        <a href="#logos-posters" class="selected-card">
          <img src="images/logos-posters.jpg" alt="Logos and posters">
          <h3>LOGOS & POSTERS</h3>
        </a>

        <a href="#harm-reduction" class="selected-card">
          <img src="images/harm-reduction.jpg" alt="Harm reduction campaign">
          <h3>HARM REDUCTION</h3>
        </a>

        <a href="#thumbnails" class="selected-card">
          <img src="images/thumbnails.jpg" alt="Thumbnails">
          <h3>THUMBNAILS</h3>
        </a>

      </div>

    </div>

  </section>

  <section class="gallery-section" id="graphics">
    <h2 class="gallery-heading animate">
      GRAPHICS
      <span class="gallery-arrows">
        <a href="#selected-work">▲</a>
        <a href="#logos-posters">▼</a>
      </span>
    </h2>

    <div class="gallery-grid animate">
      <img src="images/graphics/1.jpg" loading="lazy" alt="Graphic design work">
      <img src="images/graphics/2.jpg" loading="lazy" alt="Graphic design work">
      <img src="images/graphics/3.jpg" loading="lazy" alt="Graphic design work">
      <img src="images/graphics/4.jpg" loading="lazy" alt="Graphic design work">
      <img src="images/graphics/5.jpg" loading="lazy" alt="Graphic design work">
      <img src="images/graphics/6.jpg" loading="lazy" alt="Graphic design work">
      <img src="images/graphics/7.jpg" loading="lazy" alt="Graphic design work">
    </div>
  </section>

  <section class="gallery-section" id="logos-posters">
    <h2 class="gallery-heading animate">
      LOGOS & POSTERS
      <span class="gallery-arrows">
        <a href="#graphics">▲</a>
        <a href="#harm-reduction">▼</a>
      </span>
    </h2>

    <div class="gallery-grid animate">
      <img src="images/logos-posters/1.jpg" loading="lazy" alt="Logo and poster design">
      <img src="images/logos-posters/2.jpg" loading="lazy" alt="Logo and poster design">
      <img src="images/logos-posters/3.jpg" loading="lazy" alt="Logo and poster design">
      <img src="images/logos-posters/4.jpg" loading="lazy" alt="Logo and poster design">
      <img src="images/logos-posters/5.jpg" loading="lazy" alt="Logo and poster design">
      <img src="images/logos-posters/6.jpg" loading="lazy" alt="Logo and poster design">
      <img src="images/logos-posters/7.jpg" loading="lazy" alt="Logo and poster design">
      <img src="images/logos-posters/8.jpg" loading="lazy" alt="Logo and poster design">
      <img src="images/logos-posters/9.jpg" loading="lazy" alt="Logo and poster design">
    </div>
  </section>

  <section class="gallery-section" id="harm-reduction">
    <h2 class="gallery-heading animate">
      HARM REDUCTION
      <span class="gallery-arrows">
        <a href="#logos-posters">▲</a>
        <a href="#thumbnails">▼</a>
      </span>
    </h2>

    <div class="gallery-grid animate">
      <img src="images/harm-reduction/1.jpg" loading="lazy" alt="Harm reduction campaign design">
      <img src="images/harm-reduction/2.jpg" loading="lazy" alt="Harm reduction campaign design">
      <img src="images/harm-reduction/3.jpg" loading="lazy" alt="Harm reduction campaign design">
      <img src="images/harm-reduction/4.jpg" loading="lazy" alt="Harm reduction campaign design">
      <img src="images/harm-reduction/5.jpg" loading="lazy" alt="Harm reduction campaign design">
      <img src="images/harm-reduction/6.jpg" loading="lazy" alt="Harm reduction campaign design">
      <img src="images/harm-reduction/7.jpg" loading="lazy" alt="Harm reduction campaign design">
      <img src="images/harm-reduction/8.jpg" loading="lazy" alt="Harm reduction campaign design">
      <img src="images/harm-reduction/9.jpg" loading="lazy" alt="Harm reduction campaign design">
    </div>
  </section>

  <section class="gallery-section" id="thumbnails">
    <h2 class="gallery-heading animate">
      THUMBNAILS
      <span class="gallery-arrows">
        <a href="#harm-reduction">▲</a>
      </span>
    </h2>

    <div class="gallery-grid animate">
      <img src="images/thumbnails/1.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/2.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/3.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/4.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/5.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/6.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/7.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/8.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/9.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/10.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/11.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/12.jpg" loading="lazy" alt="Thumbnail design">
      <img src="images/thumbnails/13.jpg" loading="lazy" alt="Thumbnail design">
    </div>

    <a href="#selected-work" class="back-to-selected">
      BACK TO SELECTED WORK ▲
    </a>
  </section>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close">&times;</button>
    <button class="lightbox-arrow lightbox-prev">◀</button>

    <div class="loader" id="loader"></div>

    <img src="" alt="Expanded design piece" id="lightbox-img">

    <button class="lightbox-arrow lightbox-next">▶</button>

    <p class="lightbox-counter" id="lightbox-counter">1 / 1</p>
  </div>

  <script src="graphic-design.js"></script>
</body>
</html>
